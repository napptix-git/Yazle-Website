<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>KFC Catch & Collect</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
   
    <div class="game-container">
        <div class="header">
            <img src="./assets/KFC logo.svg.webp" alt="KFC Logo" class="header-logo">
            <div class="header-info">
                <div class="score-box">
                    <span class="label">Score</span>
                    <div class="score-value" id="score">0</div>
                </div>
                <div class="time-box">
                    <span class="label">Time</span>
                    <div class="time-value"><span id="time">15</span>s</div>
                </div>
            </div>
        </div>
        
            <div class="start-sec">
                <button id="play-button">Play</button>
            </div>
        <div class="shelf">
           <img src="./assets/shelf.webp" alt="">
           <div class="row1">
            <img src="./assets/KFC Gold burger.webp" class="items">
            <img src="./assets/KFC Gold burger.webp" class="items">
            <img src="./assets/KFC Gold burger.webp" class="items">
           </div>
           <div class="row2">
            <img src="./assets/KFC Gold burger.webp" class="items1">
            <img src="./assets/KFC Gold burger.webp" class="items1">
            <img src="./assets/KFC Gold burger.webp" class="items1">
           </div>
           <div class="row3">
            <img src="./assets/KFC Gold burger.webp" class="items2">
            <img src="./assets/KFC Gold burger.webp" class="items2">
            <img src="./assets/KFC Gold burger.webp" class="items2">
           </div>
           <div class="row4">
            <img src="./assets/KFC Gold burger.webp" class="items3">
            <img src="./assets/KFC Gold burger.webp" class="items3">
            <img src="./assets/KFC Gold burger.webp" class="items3">
           </div>
        </div>
        </div>
       <img src="./assets/KFC bucket.webp" id="cart">

    <script src="./script.js"></script>
</body>
</html>
