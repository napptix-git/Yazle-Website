<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nothing Phone (3) | Interactive Experience</title>
    <!-- Nothing uses Colfax/NDot style - using Space Grotesk as closest match -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --nothing-white: #FFFFFF;
            --nothing-black: #000000;
            --nothing-dark: #0A0A0A;
            --nothing-gray-100: #F5F5F5;
            --nothing-gray-200: #E5E5E5;
            --nothing-gray-300: #D4D4D4;
            --nothing-gray-400: #A3A3A3;
            --nothing-gray-500: #737373;
            --nothing-gray-600: #525252;
            --nothing-gray-700: #404040;
            --nothing-gray-800: #262626;
            --nothing-gray-900: #171717;
            --nothing-red: #D71921;
        }

        body {
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--nothing-dark);
            color: var(--nothing-white);
            overflow: hidden;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        canvas {
            display: block;
        }

        /* Loading Screen - Nothing Style */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--nothing-dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #loader.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loader-logo {
            font-size: 1.5rem;
            font-weight: 500;
            letter-spacing: 0.3em;
            margin-bottom: 60px;
            opacity: 0;
            animation: fadeInUp 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            text-transform: lowercase;
        }

        .loader-logo span {
            color: var(--nothing-white);
        }

        .loader-bar {
            width: 120px;
            height: 1px;
            background: var(--nothing-gray-800);
            overflow: hidden;
            opacity: 0;
            animation: fadeInUp 0.8s cubic-bezier(0.4, 0, 0.2, 1) 0.2s forwards;
        }

        .loader-progress {
            height: 100%;
            background: var(--nothing-white);
            width: 0%;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .loader-text {
            margin-top: 24px;
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeInUp 0.8s cubic-bezier(0.4, 0, 0.2, 1) 0.4s forwards;
            color: var(--nothing-gray-500);
            font-weight: 400;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header - Nothing Style */
        #header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 24px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #header.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .logo {
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: lowercase;
        }

        .logo span {
            color: var(--nothing-white);
        }

        .header-cta {
            padding: 12px 28px;
            background: var(--nothing-white);
            color: var(--nothing-black);
            border: none;
            border-radius: 0;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
        }

        .header-cta:hover {
            background: var(--nothing-gray-100);
            transform: translateY(-1px);
        }

        /* Interaction Hint - Nothing Style */
        #hint {
            position: fixed;
            left: 32px;
            top: 50%;
            transform: translateY(-50%);
            text-align: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            background: rgba(0, 0, 0, 0.6);
            padding: 20px 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        #hint.visible {
            opacity: 1;
        }

        .hint-icon {
            width: 36px;
            height: 36px;
            margin: 0 auto 10px;
            animation: rotateHint 2.5s ease-in-out infinite;
            opacity: 0.8;
        }

        @keyframes rotateHint {
            0%, 100% { transform: rotate(-15deg); }
            50% { transform: rotate(15deg); }
        }

        .hint-text {
            font-size: 0.6rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--nothing-white);
            font-weight: 400;
            opacity: 0.8;
        }

        /* Hotspot Indicators - More Visible */
        .hotspot-indicator {
            position: fixed;
            pointer-events: none;
            z-index: 50;
            opacity: 0;
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .hotspot-indicator.visible {
            opacity: 1;
        }

        .hotspot-pulse {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            position: relative;
            cursor: pointer;
            pointer-events: auto;
        }

        .hotspot-pulse::before,
        .hotspot-pulse::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
        }

        .hotspot-pulse::before {
            width: 18px;
            height: 18px;
            background: var(--nothing-white);
            box-shadow: 0 0 20px rgba(255,255,255,0.9), 0 0 40px rgba(255,255,255,0.5);
            z-index: 2;
        }

        .hotspot-pulse::after {
            width: 70px;
            height: 70px;
            border: 2px solid rgba(255,255,255,0.7);
            animation: pulseRing 2s ease-out infinite;
        }

        .hotspot-pulse .pulse-ring-2 {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50%;
            animation: pulseRing 2s ease-out infinite 0.5s;
        }

        .hotspot-pulse .pulse-ring-3 {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            animation: pulseRing 2s ease-out infinite 1s;
        }

        @keyframes pulseRing {
            0% {
                transform: translate(-50%, -50%) scale(0.3);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(2.5);
                opacity: 0;
            }
        }

        .hotspot-label {
            position: absolute;
            top: 50%;
            left: 85px;
            transform: translateY(-50%);
            white-space: nowrap;
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--nothing-white);
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        .hotspot-indicator:hover .hotspot-label {
            opacity: 1;
        }

        /* Info Panel - Nothing Style */
        #info-panel {
            position: fixed;
            top: 0;
            right: -450px;
            width: 450px;
            max-width: 100vw;
            height: 100vh;
            background: var(--nothing-dark);
            backdrop-filter: blur(40px);
            z-index: 200;
            transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            border-left: 1px solid var(--nothing-gray-800);
        }

        #info-panel.open {
            right: 0;
        }

        .panel-close {
            position: absolute;
            top: 24px;
            right: 24px;
            width: 48px;
            height: 48px;
            background: transparent;
            border: 1px solid var(--nothing-gray-700);
            border-radius: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .panel-close:hover {
            background: var(--nothing-gray-800);
            border-color: var(--nothing-gray-600);
        }

        .panel-close svg {
            width: 16px;
            height: 16px;
            stroke: var(--nothing-white);
        }

        .panel-content {
            padding: 100px 40px 60px;
        }

        .panel-icon {
            width: 64px;
            height: 64px;
            background: var(--nothing-white);
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 32px;
        }

        .panel-icon svg {
            width: 28px;
            height: 28px;
            stroke: var(--nothing-black);
            fill: none;
        }

        .panel-title {
            font-size: 1.75rem;
            font-weight: 500;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }

        .panel-subtitle {
            font-size: 0.9rem;
            color: var(--nothing-gray-400);
            margin-bottom: 48px;
            line-height: 1.7;
            font-weight: 400;
        }

        .spec-group {
            margin-bottom: 40px;
        }

        .spec-group-title {
            font-size: 0.65rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--nothing-gray-500);
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--nothing-gray-800);
        }

        .spec-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 14px 0;
            border-bottom: 1px solid var(--nothing-gray-900);
        }

        .spec-item:last-child {
            border-bottom: none;
        }

        .spec-label {
            font-size: 0.8rem;
            color: var(--nothing-gray-500);
            flex: 1;
            font-weight: 400;
        }

        .spec-value {
            font-size: 0.8rem;
            font-weight: 500;
            text-align: right;
            flex: 1;
            color: var(--nothing-white);
        }

        .feature-badge {
            display: inline-block;
            padding: 8px 16px;
            background: var(--nothing-gray-900);
            color: var(--nothing-white);
            border-radius: 0;
            font-size: 0.65rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            margin: 4px 8px 4px 0;
            border: 1px solid var(--nothing-gray-800);
        }

        .feature-badges {
            margin-top: 32px;
        }

        /* Overlay */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            z-index: 150;
        }

        #overlay.visible {
            opacity: 1;
            visibility: visible;
        }

        /* View Indicator - Nothing Style */
        #view-indicator {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #view-indicator.visible {
            opacity: 1;
        }

        .view-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--nothing-gray-600);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .view-dot.active {
            background: var(--nothing-white);
        }

        .view-label {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.55rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            white-space: nowrap;
            color: var(--nothing-gray-500);
            font-weight: 400;
        }

        /* Stats Bar - Nothing Style */
        #stats-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--nothing-dark);
            backdrop-filter: blur(20px);
            padding: 20px 40px;
            display: flex;
            justify-content: space-around;
            border-top: 1px solid var(--nothing-gray-800);
            z-index: 100;
            transform: translateY(100%);
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #stats-bar.visible {
            transform: translateY(0);
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--nothing-white);
            letter-spacing: -0.02em;
        }

        .stat-label {
            font-size: 0.55rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--nothing-gray-500);
            margin-top: 6px;
            font-weight: 400;
        }

        /* Intro Animation - Nothing Style */
        .intro-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 90;
            opacity: 0;
            pointer-events: none;
        }

        .intro-text.visible {
            animation: introFade 3.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes introFade {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.95); }
            15% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            85% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1.02); }
        }

        .intro-text h1 {
            font-size: 2.5rem;
            font-weight: 500;
            letter-spacing: -0.03em;
            margin-bottom: 16px;
        }

        .intro-text h1 span {
            color: var(--nothing-gray-400);
        }

        .intro-text p {
            font-size: 0.8rem;
            color: var(--nothing-gray-500);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-weight: 400;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            #header {
                padding: 16px 20px;
            }

            .logo {
                font-size: 0.8rem;
            }

            .header-cta {
                padding: 10px 20px;
                font-size: 0.7rem;
            }

            #info-panel {
                width: 100%;
                right: -100%;
            }

            .panel-content {
                padding: 80px 24px 40px;
            }

            .panel-title {
                font-size: 1.4rem;
            }

            .panel-subtitle {
                font-size: 0.85rem;
                margin-bottom: 36px;
            }

            .intro-text h1 {
                font-size: 1.8rem;
            }

            .intro-text p {
                font-size: 0.7rem;
            }

            #stats-bar {
                padding: 16px 20px;
            }

            .stat-value {
                font-size: 0.95rem;
            }

            .stat-label {
                font-size: 0.5rem;
            }

            #hint {
                left: 16px;
                padding: 14px 12px;
            }

            .hint-icon {
                width: 28px;
                height: 28px;
            }

            .hint-text {
                font-size: 0.55rem;
            }

            .hotspot-pulse {
                width: 60px;
                height: 60px;
            }

            .hotspot-pulse::before {
                width: 14px;
                height: 14px;
            }

            .hotspot-pulse::after,
            .hotspot-pulse .pulse-ring-2,
            .hotspot-pulse .pulse-ring-3 {
                width: 60px;
                height: 60px;
            }

            .hotspot-label {
                display: none;
            }
        }

        /* Scrollbar styling */
        #info-panel::-webkit-scrollbar {
            width: 4px;
        }

        #info-panel::-webkit-scrollbar-track {
            background: transparent;
        }

        #info-panel::-webkit-scrollbar-thumb {
            background: var(--nothing-gray-700);
            border-radius: 0;
        }

        /* Focus states for accessibility */
        button:focus-visible {
            outline: 1px solid var(--nothing-white);
            outline-offset: 2px;
        }

        .hotspot-pulse:focus-visible {
            outline: 1px solid var(--nothing-white);
            outline-offset: 4px;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loader">
        <div class="loader-logo"><span>nothing</span></div>
        <div class="loader-bar">
            <div class="loader-progress" id="loader-progress"></div>
        </div>
        <div class="loader-text">phone (3)</div>
    </div>

    <!-- Header -->
    <header id="header">
        <div class="logo"><span>nothing</span></div>
        <button class="header-cta" onclick="window.open('https://in.nothing.tech/products/phone-3', '_blank')">Shop Now</button>
    </header>

    <!-- Intro Text -->
    <div class="intro-text" id="intro-text">
        <h1>phone <span>(3)</span></h1>
        <p>power in its purest form</p>
    </div>

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Interaction Hint -->
    <div id="hint">
        <svg class="hint-icon" viewBox="0 0 50 50" fill="none" stroke="white" stroke-width="1">
            <rect x="17" y="7" width="16" height="36" rx="2"/>
            <path d="M8 25 L17 25 M33 25 L42 25" stroke-dasharray="2 3" opacity="0.5"/>
            <path d="M10 23 L8 25 L10 27 M40 23 L42 25 L40 27" opacity="0.5"/>
        </svg>
        <p class="hint-text">drag to rotate</p>
    </div>

    <!-- View Indicator -->
    <div id="view-indicator">
        <div class="view-dot active" data-view="front"></div>
        <div class="view-dot" data-view="back"></div>
        <span class="view-label" id="view-label">front</span>
    </div>

    <!-- Stats Bar -->
    <div id="stats-bar">
        <div class="stat-item">
            <div class="stat-value">50MP</div>
            <div class="stat-label">quad camera</div>
        </div>
        <div class="stat-item">
            <div class="stat-value">4500</div>
            <div class="stat-label">peak nits</div>
        </div>
        <div class="stat-item">
            <div class="stat-value">SD 8S</div>
            <div class="stat-label">gen 4</div>
        </div>
        <div class="stat-item">
            <div class="stat-value">5150</div>
            <div class="stat-label">mAh</div>
        </div>
    </div>

    <!-- Hotspot Indicators -->
    <div class="hotspot-indicator" id="hotspot-camera">
        <div class="hotspot-pulse" onclick="openPanel('camera')">
            <span class="pulse-ring-2"></span>
            <span class="pulse-ring-3"></span>
        </div>
        <span class="hotspot-label">camera</span>
    </div>

    <div class="hotspot-indicator" id="hotspot-screen">
        <div class="hotspot-pulse" onclick="openPanel('screen')">
            <span class="pulse-ring-2"></span>
            <span class="pulse-ring-3"></span>
        </div>
        <span class="hotspot-label">display</span>
    </div>

    <div class="hotspot-indicator" id="hotspot-processor">
        <div class="hotspot-pulse" onclick="openPanel('processor')">
            <span class="pulse-ring-2"></span>
            <span class="pulse-ring-3"></span>
        </div>
        <span class="hotspot-label">processor</span>
    </div>

    <!-- Overlay -->
    <div id="overlay" onclick="closePanel()"></div>

    <!-- Info Panel -->
    <div id="info-panel">
        <button class="panel-close" onclick="closePanel()">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
                <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
        </button>
        <div class="panel-content" id="panel-content">
            <!-- Content will be dynamically inserted -->
        </div>
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // Panel Data
        const panelData = {
            camera: {
                icon: `<svg viewBox="0 0 24 24" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M12 2v4m0 12v4m10-10h-4M6 12H2m15.07-7.07l-2.83 2.83M9.76 14.24l-2.83 2.83m0-10.14l2.83 2.83m4.48 4.48l2.83 2.83"/></svg>`,
                title: 'Camera System',
                subtitle: 'Four 50MP cameras. Capture everything with unprecedented clarity and detail.',
                specs: [
                    {
                        title: 'Main Camera',
                        items: [
                            { label: 'Resolution', value: '50MP' },

                            { label: 'Sensor Size', value: '1/1.3"' },

                    {

                    {

                            { label: 'Aperture', value: 'f/2.2' }

                    },
                    {
                        title: 'Front Camera',
                        items: [
                            { label: 'Resolution', value: '50MP' },
                            { label: 'Field of View', value: '81.2°' },
                            { label: 'Aperture', value: 'f/2.2' }
                        ]
                    }
                ],
                features: ['TrueLens Engine 4', 'Ultra XDR', 'Night Mode', 'Action Mode', 'Portrait Optimiser', '4K Video']
            },
            screen: {

                specs: [

                        ]
                    },
                    {

                        items: [

                    },
                    {

                        items: [
                            { label: 'Color Depth', value: '10-bit' },

                        ]
                    }
                ],
                features: ['Flexible AMOLED', 'HDR10+', 'Always-On Display', 'DC Dimming', 'Eye Comfort']
            },
            processor: {
                icon: `<svg viewBox="0 0 24 24" stroke-width="1.5"><rect x="6" y="6" width="12" height="12" rx="1"/><path d="M6 9H3m3 3H3m3 3H3m18-6h-3m3 3h-3m3 3h-3M9 6V3m3 3V3m3 3V3m-6 18v-3m3 3v-3m3 3v-3"/></svg>`,
                title: 'Processor',
                subtitle: 'Powered by Snapdragon 8S Gen 4. Raw power meets intelligent efficiency.',
                specs: [
                    {
                        title: 'Chipset',
                        items: [
                            { label: 'Name', value: 'Snapdragon 8S Gen 4' },
                            { label: 'Process', value: '4nm TSMC' },

                    },
                    {

                        items: [

                        items: [

                            { label: 'AI Engine', value: 'Qualcomm AI' }

                ],
                features: ['Essential Search', 'AI-Powered', 'New Glyph Interface', 'IP68 Rated', '5G Ready']
            }
        };

        // Scene Setup
        let scene, camera, renderer, controls, phone;
        let hotspots = { camera: null, screen: null, processor: null };
        let isLoaded = false;
        let currentView = 'front';

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            // Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 5);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.enableZoom = false;
            controls.enablePan = false;
            controls.rotateSpeed = 0.5;
            controls.minPolarAngle = Math.PI / 3;
            controls.maxPolarAngle = Math.PI / 1.5;

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0xffffff, 1);
            mainLight.position.set(5, 5, 5);
            scene.add(mainLight);

            const fillLight = new THREE.DirectionalLight(0xffffff, 0.5);
            fillLight.position.set(-5, 0, 5);
            scene.add(fillLight);

            const backLight = new THREE.DirectionalLight(0xffffff, 0.3);
            backLight.position.set(0, 5, -5);
            scene.add(backLight);

            // Add subtle red accent light
            const accentLight = new THREE.PointLight(0xD71921, 0.3, 10);
            accentLight.position.set(-3, -2, 3);
            scene.add(accentLight);

            // Load Model
            loadModel();

            // Events
            window.addEventListener('resize', onWindowResize);
            controls.addEventListener('change', updateHotspots);

            animate();
        }

        function loadModel() {
            const loader = new THREE.GLTFLoader();
            const progressBar = document.getElementById('loader-progress');

            // Setup DRACO loader for compressed models
            const dracoLoader = new THREE.DRACOLoader();
            dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
            loader.setDRACOLoader(dracoLoader);

            loader.load(
                'phone-compressed.glb',
                function(gltf) {
                    phone = gltf.scene;

                    // Center and scale the model
                    const box = new THREE.Box3().setFromObject(phone);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());

                    phone.position.sub(center);

                    const maxDim = Math.max(size.x, size.y, size.z);
                    const scale = 3 / maxDim;
                    phone.scale.setScalar(scale);

                    scene.add(phone);

                    // Calculate hotspot positions based on model
                    calculateHotspotPositions(box, scale);

                    // Loading complete
                    setTimeout(() => {
                        document.getElementById('loader').classList.add('hidden');
                        showUI();
                    }, 500);

                    isLoaded = true;
                },
                function(xhr) {
                    const progress = (xhr.loaded / xhr.total) * 100;
                    progressBar.style.width = progress + '%';
                },
                function(error) {
                    console.error('Error loading model:', error);
                }
            );
        }

        function calculateHotspotPositions(box, scale) {
            // These are relative positions on the phone model
            // Adjust based on actual model dimensions
            const phoneHeight = (box.max.y - box.min.y) * scale;
            const phoneWidth = (box.max.x - box.min.x) * scale;
            const phoneDepth = (box.max.z - box.min.z) * scale;

            hotspots = {
                // Camera position - upper back of phone (positive Z = back for this model)
                camera: new THREE.Vector3(0, phoneHeight * 0.3, phoneDepth * 0.6),
                // Screen position - center front of phone (negative Z = front for this model)
                screen: new THREE.Vector3(0, 0, -phoneDepth * 0.6),
                // Processor position - center back of phone
                processor: new THREE.Vector3(0, -phoneHeight * 0.1, phoneDepth * 0.6)
            };
        }

        let idleTimer = null;
        let hasInteracted = false;

        function showHint() {
            document.getElementById('hint').classList.add('visible');
        }

        function hideHint() {
            document.getElementById('hint').classList.remove('visible');
        }

        function resetIdleTimer() {
            // Clear existing timer
            if (idleTimer) {
                clearTimeout(idleTimer);
            }
            // Hide hint when user interacts
            hideHint();
            hasInteracted = true;
            // Show hint again after 1.5 seconds of inactivity
            idleTimer = setTimeout(() => {
                showHint();
            }, 1500);
        }

        function setupIdleDetection() {
            // Listen for any interaction
            const events = ['pointerdown', 'pointermove', 'pointerup', 'touchstart', 'touchmove', 'wheel'];
            events.forEach(event => {
                renderer.domElement.addEventListener(event, resetIdleTimer);
            });

            // Also listen on document for general activity
            document.addEventListener('mousemove', resetIdleTimer);
            document.addEventListener('keydown', resetIdleTimer);
        }

        function showUI() {
            // Show intro text
            document.getElementById('intro-text').classList.add('visible');

            // After intro, show other UI elements
            setTimeout(() => {
                document.getElementById('header').classList.add('visible');
                document.getElementById('view-indicator').classList.add('visible');
                document.getElementById('stats-bar').classList.add('visible');

                // Show hotspots
                setTimeout(() => {
                    updateHotspots();
                }, 500);

                // Show hint initially after a short delay
                setTimeout(() => {
                    showHint();
                    // Setup idle detection
                    setupIdleDetection();
                }, 800);
            }, 3000);
        }

        function updateHotspots() {
            if (!isLoaded || !phone) return;

            const phoneRotation = phone.rotation.y + controls.getAzimuthalAngle();
            const normalizedRotation = ((phoneRotation % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);

            // Determine if viewing front or back (inverted for this model)
            // Front view = looking at screen (negative Z side)
            const isBackView = normalizedRotation < Math.PI / 2 || normalizedRotation > Math.PI * 1.5;
            const isFrontView = normalizedRotation > Math.PI / 2 && normalizedRotation < Math.PI * 1.5;

            // Update view indicator
            if (isFrontView && currentView !== 'front') {
                currentView = 'front';
                updateViewIndicator('front');
            } else if (isBackView && currentView !== 'back') {
                currentView = 'back';
                updateViewIndicator('back');
            }

            // Update hotspot visibility and positions
            // Camera and processor show on back, screen shows on front
            updateSingleHotspot('camera', hotspots.camera, isBackView);
            updateSingleHotspot('screen', hotspots.screen, isFrontView);
            updateSingleHotspot('processor', hotspots.processor, isBackView);
        }

        function updateSingleHotspot(name, position, visible) {
            const element = document.getElementById('hotspot-' + name);

            if (visible && position) {
                const screenPos = toScreenPosition(position);
                element.style.left = screenPos.x - 30 + 'px';
                element.style.top = screenPos.y - 30 + 'px';
                element.classList.add('visible');
            } else {
                element.classList.remove('visible');
            }
        }

        function toScreenPosition(position) {
            const vector = position.clone();
            vector.project(camera);

            return {
                x: (vector.x * 0.5 + 0.5) * window.innerWidth,
                y: (-vector.y * 0.5 + 0.5) * window.innerHeight
            };
        }

        function updateViewIndicator(view) {
            const dots = document.querySelectorAll('.view-dot');
            const label = document.getElementById('view-label');

            dots.forEach(dot => {
                dot.classList.remove('active');
                if (dot.dataset.view === view) {
                    dot.classList.add('active');
                }
            });

            label.textContent = view === 'front' ? 'Front View' : 'Back View';
        }

        function openPanel(type) {
            const panel = document.getElementById('info-panel');
            const content = document.getElementById('panel-content');
            const overlay = document.getElementById('overlay');
            const data = panelData[type];

            let html = `
                <div class="panel-icon">${data.icon}</div>
                <h2 class="panel-title">${data.title}</h2>
                <p class="panel-subtitle">${data.subtitle}</p>
            `;

            data.specs.forEach(group => {
                html += `
                    <div class="spec-group">
                        <div class="spec-group-title">${group.title}</div>
                        ${group.items.map(item => `
                            <div class="spec-item">
                                <span class="spec-label">${item.label}</span>
                                <span class="spec-value">${item.value}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            });

            html += `
                <div class="feature-badges">
                    ${data.features.map(f => `<span class="feature-badge">${f}</span>`).join('')}
                </div>
            `;

            content.innerHTML = html;
            panel.classList.add('open');
            overlay.classList.add('visible');
        }

        function closePanel() {
            document.getElementById('info-panel').classList.remove('open');
            document.getElementById('overlay').classList.remove('visible');
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            // Subtle idle animation
            if (phone && !controls.enabled) {
                phone.rotation.y += 0.001;
            }

            renderer.render(scene, camera);
        }

        // Keyboard controls for panel
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closePanel();
            }
        });

        // Initialize
        init();
    </script>
