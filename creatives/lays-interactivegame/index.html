<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>Delivery Game</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
   
    <div class="game-container">
        <div class="header">
            <img src="./assets/LAYS.png" alt="Lays Logo" class="header-logo">
            <div class="header-info">
                <div class="score-box">
                    <span class="label">Score</span>
                    <div class="score-value" id="score">0</div>
                </div>
                <div class="time-box">
                    <span class="label">Time</span>
                    <div class="time-value"><span id="time">15</span>s</div>
                </div>
            </div>
        </div>
        
            <div class="start-sec">
                <img src="./assets/Gemini_Generated_Image_uzrf0vuzrf0vuzrf.png" alt="" srcset="">
                <button id="play-button">Play</button>
            </div>
        <div class="shelf">
           <img src="./assets/shelf.png" alt="">
           <div class="row1">
            <img src="./assets/LAY_S__Classic_Potato_Chips_shelf-removebg-preview.png" class="items">
            <img src="./assets/lays limon.png" class="items">
            <img src="./assets/LAY_S__Chile_Limón_Flavored_Potato_Chips-removebg-preview.png" class="items">
           </div>
           <div class="row2">
            <img src="./assets/lays_all_dressed_shelf-removebg-preview.png" class="items1 lays-shelf">
            <img src="./assets/LAY_S__Flamin__Hot_Flavored_Potato_Chips-removebg-preview.png" class="items1">
            <img src="./assets/LAY_S__Salt___Vinegar_Flavored_Potato_Chips-removebg-preview.png" class="items1">
           </div>
           <div class="row3">
            <img src="./assets/lays_barbecue_flavored_shelf-removebg-preview.png" class="items2">
            <img src="./assets/lays_honey_barbecue-removebg-preview.png" class="items2">
            <img src="./assets/lays_sour_cream___onion_shelf-removebg-preview.png" class="items2">
           </div>
           <div class="row4">
            <img src="./assets/lays_all_dressed_shelf-removebg-preview.png" class="items3 lays-shelf" >
            <img src="./assets/LAY_S__Cheddar___Sour_Cream_Flavored_Potato_Chips-removebg-preview.png" class="items3" >
            <img src="./assets/LAY_S__Sweet___Spicy_Honey_Potato_Chips-removebg-preview.png" class="items3" >
           </div>
        </div>
        </div>
       <img src="./assets/cart.png" id="cart">

    <script src="./script.js"></script>
</body>
</html>
